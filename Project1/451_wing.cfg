%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file
% Case: 3D RC plane, external aerodynamics (Incompressible RANS, SA)
% Notes:
%  - Viscous: includes skin-friction drag + boundary layer effects
%  - SA model: decent baseline for attached flow, not magic for separation
%  - For good viscous drag: mesh needs inflation layers (target y+ ~ 1)
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ---------------------- DIRECT PROBLEM DEFINITION ----------------------------%
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% ---------------- INCOMPRESSIBLE FREESTREAM / INITIAL STATE -----------------%
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= ( 10.0, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 287.75

% Non-dimensionalization
INC_NONDIM= INITIAL_VALUES

% ---------------------- TRANSPORT PROPERTIES --------------------------------%
% Use either constant viscosity (mu) or a turbulence-friendly model.
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.787e-5

% ---------------------- REFERENCE VALUES (FOR CL/CD/CM) ----------------------%
% Use wing planform area for REF_AREA and MAC for REF_LENGTH
% If you use symmetry (half-model), either:
%  - set REF_AREA to half-wing area, OR
%  - keep full REF_AREA and multiply forces by 2 yourself
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0

REF_LENGTH= 0.3536
REF_AREA= 0.25

% --------------------------- BOUNDARY CONDITIONS -----------------------------%
% No-slip adiabatic wall for viscous aero:
MARKER_HEATFLUX= ( BC_3, 0.0 )

% Farfield and symmetry
MARKER_FAR= ( BC_1 )
MARKER_SYM= ( BC_2 )

% Surface output + force monitoring
MARKER_PLOTTING= ( BC_3 )
MARKER_MONITORING= ( BC_3 )

% --------------------------- NUMERICAL METHOD --------------------------------%
NUM_METHOD_GRAD= GREEN_GAUSS

% Flow discretization
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

% Turbulence discretization
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
SLOPE_LIMITER_TURB= VENKATAKRISHNAN
TIME_DISCRE_TURB= EULER_IMPLICIT

% SA freestream setting (usually 3–5 is fine)
FREESTREAM_NU_FACTOR= 3.0

% ------------------------ LINEAR SOLVER (IMPLICIT) ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-10
LINEAR_SOLVER_ITER= 10

% ---------------------------- CFL / ITERATIONS ------------------------------%
% Viscous runs often need lower CFL than Euler to stay stable.
CFL_NUMBER= 10.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.1, 2.0, 1.0, 1e3 )
MAX_DELTA_TIME= 1E6

ITER= 1000


% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
% Multi-Grid Levels (0 = no multi-grid)
MGLEVEL= 3
%
% Multi-grid cycle (V_CYCLE, W_CYCLE, FULLMG_CYCLE)
MGCYCLE= W_CYCLE
%
% Multi-grid pre-smoothing level
MG_PRE_SMOOTH= ( 1, 1, 1, 1 )
%
% Multi-grid post-smoothing level
MG_POST_SMOOTH= ( 0, 0, 0, 0 )
%
% Jacobi implicit smoothing of the correction
MG_CORRECTION_SMOOTH= ( 0, 0, 0, 0 )
%
% Damping factor for the residual restriction
MG_DAMP_RESTRICTION= 0.7
%
% Damping factor for the correction prolongation
MG_DAMP_PROLONGATION= 0.7

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
% ------------------------------ CONVERGENCE ---------------------------------%
% Residual + Cauchy to ensure coefficients settle
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 100
CONV_CAUCHY_ELEMS= 200
CONV_CAUCHY_EPS= 1E-7

% ------------------------------ INPUT/OUTPUT --------------------------------%
MESH_FILENAME= VISTestWing.su2
MESH_FORMAT= SU2

SOLUTION_FILENAME= solution_flow
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow

OUTPUT_WRT_FREQ= 200
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_PRESSURE, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, AERO_FORCES )